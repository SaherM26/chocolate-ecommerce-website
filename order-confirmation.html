<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Ready | Chocolate House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="announcement">Your WhatsApp order message is ready</div>

  <main class="confirmation-page">
    <section class="confirmation-card reveal is-visible">
      <p class="eyebrow">Almost done</p>
      <h1>Please send the WhatsApp message to confirm your order.</h1>
      <p>
        WhatsApp has opened with your full Chocolate House order. Tap send there so we can confirm
        delivery charges, payment, and preparation time.
      </p>
      <div class="confirmation-summary" id="confirmation-summary"></div>
      <div class="hero-actions">
        <a class="button primary" href="index.html">Continue shopping</a>
        <a class="button secondary dark-secondary" href="checkout.html">Back to checkout</a>
      </div>
    </section>
  </main>

  <script src="confirmation.js"></script>
</body>

</html>
